name: CI

on:
  pull_request:
    # labeled: `update-snapshots` 라벨을 붙이면 화면 기준 이미지를 다시 만든다
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm build
      - name: Bundle budget (gallery)
        run: pnpm check:bundle
      - name: npm package contents
        run: pnpm check:package

  e2e:
    # 러너 CPU 가 적어 한 job 안에서는 worker 가 1개뿐이다 — 애니메이션 타이밍을 재는 테스트가 있어
    # worker 를 늘리지 않고 job 을 나눠 동시에 돌린다 (데스크톱 + 폰 테스트를 4등분)
    name: e2e (playwright ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Chromium
        run: pnpm --filter @awesome/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  storybook:
    name: storybook (stories + a11y)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Generated stories match the interaction list
        run: pnpm stories:gen --check
      - name: Install Chromium
        run: pnpm --filter @awesome/storybook exec playwright install --with-deps chromium
      - name: Render every story, run play functions and axe
        run: pnpm test:stories

  visual:
    name: visual (screenshots)
    runs-on: ubuntu-latest
    # 기준 이미지와 같은 렌더링 환경 — 로컬(macOS)과는 글꼴 렌더링이 달라 비교하지 않는다
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      UPDATE: ${{ contains(github.event.pull_request.labels.*.name, 'update-snapshots') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup
      - name: Compare screenshots
        if: env.UPDATE != 'true'
        run: pnpm test:visual
      - name: Update screenshots
        if: env.UPDATE == 'true'
        run: pnpm --filter @awesome/e2e exec playwright test --project=visual --update-snapshots=all
      - name: Hand the screenshots to commit-screenshots
        if: env.UPDATE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: e2e/tests/__screenshots__
          retention-days: 1
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: e2e/test-results
          retention-days: 7

  # `update-snapshots` 라벨: 새 기준 이미지를 PR 브랜치에 커밋하고 라벨을 뗀다.
  # 봇이 푸시한 커밋의 CI 는 사람의 승인을 기다린다 — PR 에서 이미지를 확인하고 워크플로 실행을 승인한다.
  # (workflow_dispatch 로 스스로 시작한 CI 는 같은 커밋에서 통과해도 필수 검사로 인정되지 않는다)
  # 쓰기 권한은 여기에만 있다 — PR 의 코드를 실행하지 않고 이미지(png)만 옮긴다. 포크의 PR 에서는 돌지 않는다.
  commit-screenshots:
    name: commit screenshots
    needs: visual
    if: >-
      contains(github.event.pull_request.labels.*.name, 'update-snapshots')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.head_ref }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
      - name: Commit and push
        run: |
          if [ -n "$(find "$RUNNER_TEMP/screenshots" -type f ! -name '*.png')" ]; then
            echo "::error::png 가 아닌 파일이 있습니다"
            exit 1
          fi
          rsync -a --delete "$RUNNER_TEMP/screenshots/" e2e/tests/__screenshots__/
          git add -A e2e/tests/__screenshots__
          drop_label() { gh api --silent -X DELETE "repos/$GH_REPO/issues/$PR/labels/update-snapshots"; }
          if git diff --cached --quiet; then
            echo "screenshots unchanged"
            drop_label
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "test(visual): update screenshots"
          # 그사이 브랜치가 앞서갔으면 밀어 넣지 않고 실패한다
          git push origin "HEAD:refs/heads/$BRANCH"
          drop_label

  design-audit:
    name: design audit (hallmark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Restore the Hallmark skill from skills-lock.json
        run: pnpm skills:install
      - name: Install puppeteer-core outside the repo
        run: npm i --prefix "$RUNNER_TEMP/pptr" --no-audit --no-fund puppeteer-core
      - name: Audit every target
        env:
          HALLMARK_PUPPETEER: ${{ runner.temp }}/pptr
          CHROME_PATH: /usr/bin/google-chrome
        run: pnpm audit:design all
