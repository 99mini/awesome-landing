# @99mini/interactions 를 npm 에 올린다. 손으로 실행할 때만 돈다 (Actions → Release → Run workflow).
# 토큰을 저장하지 않는다 — npm 의 Trusted Publisher(OIDC)로 이 워크플로만 올릴 수 있게 한다.
# 처음 한 번은 손으로 올려야 npm 에서 Trusted Publisher 를 설정할 수 있다 (README 의 "npm 배포").
name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 올리지 않고 무엇이 올라갈지만 본다
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm check:package
      - run: pnpm --filter @99mini/interactions pack --pack-destination "$RUNNER_TEMP"
      # 검사한 tarball 을 그대로 올린다. 이미 있는 버전이면 npm 이 거절한다
      - name: Publish
        run: npm publish "$RUNNER_TEMP"/99mini-interactions-*.tgz --access public ${{ inputs.dry-run && '--dry-run' || '' }}
