packages:
  - apps/*
  - landings/*
  - packages/*
  - examples/*
  - e2e

# 모든 워크스페이스가 공유하는 버전 (package.json 에서 "catalog:" 로 참조)
catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/node": ^24.19.2
  "@playwright/test": ^1.65.1
  "@axe-core/playwright": ^4.14.0
  storybook: ^10.6.8
  "@storybook/react-vite": ^10.6.8
  "@storybook/addon-a11y": ^10.6.8
  "@storybook/addon-docs": ^10.6.8
  "@storybook/addon-vitest": ^10.6.8
  vitest: ^5.1.1
  "@vitest/browser": ^5.1.1
  "@vitest/browser-playwright": ^5.1.1
  playwright: ^1.65.1
  motion: ^14.14.0
  "@vanilla-extract/css": ^1.21.3
  "@vanilla-extract/dynamic": ^2.1.5
  "@vanilla-extract/vite-plugin": ^5.2.6
  react-router: ^8.5.2
  sugar-high: ^2.7.0
  typescript: ^7.0.2
  vite: ^8.3.8
  tailwindcss: ^4.3.5
  "@tailwindcss/vite": ^4.3.5
  "@vitejs/plugin-react": ^6.3.0
  oxlint: ^1.94.0
  oxfmt: ^0.79.0

# 설치 스크립트 실행 허용 목록
allowBuilds:
  # @vanilla-extract/vite-plugin 이 .css.ts 를 평가할 때 사용
  esbuild: true
